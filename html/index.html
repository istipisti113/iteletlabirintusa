<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" type="image/x-icon" href="./menu_pictures/x-icon/Title-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Eater&family=MedievalSharp&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
  <title>Ítélet Labirintusa</title>

  <link rel="icon" href="title-icon.png" type="image/x-icon">
  <script src="scroll-animations.js"></script>
</head>
<body>
  <!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ítélet Labirintusa - Kalandjáték</title>
</head>
<body>
    <div class="blood-drips"></div>
    <div class="floating-skulls"></div>
    <div class="dark-mist"></div>
    
    <div class="container">
        <div id="header">
            <script>
                loadPageAddClass("/header", "header", "home")
            </script>
        </div>

        <main class="main-content">
            <!-- Bal oldal: Karakter -->
            <section class="character-section dark-card">
                <h2><i class="fas fa-user"></i> Karaktered</h2>
                <div class="character-sheet">
                    <div class="stat">
                        <div class="stat-name">Ügyesség</div>
                        <div class="dice-value-container">
                            <div class="dice dark-dice" id="agility-value">0</div>
                        </div>
                        <button class="stat-btn" onclick="rollStat('agility')">
                            <i class="fas fa-dice"></i> Dobás
                        </button>
                    </div>
                    <div class="stat">
                        <div class="stat-name">Életerő</div>
                        <div class="dice-value-container">
                            <div class="dice dark-dice" id="health-value">0</div>
                        </div>
                        <button class="stat-btn" onclick="rollStat('health')">
                            <i class="fas fa-dice"></i> Dobás
                        </button>
                    </div>
                    <div class="stat">
                        <div class="stat-name">Szerencse</div>
                        <div class="dice-value-container">
                            <div class="dice dark-dice" id="luck-value">0</div>
                        </div>
                        <button class="stat-btn" onclick="rollStat('luck')">
                            <i class="fas fa-dice"></i> Dobás
                        </button>
                    </div>
                    <div class="stat">
                        <div class="stat-name">Kezdeti Életerő</div>
                        <div class="dice-value-container">
                            <div class="dice dark-dice" id="initial-health-value">0</div>
                        </div>
                        <div class="stat-btn" id="kezdetiala"></div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn primary-dark-btn" onclick="generateCharacter()">
                        <i class="fas fa-magic"></i> Karakter generálása
                    </button>
                    <button class="btn dark-btn" onclick="resetCharacter()">
                        <i class="fas fa-redo"></i> Alaphelyzet
                    </button>
                </div>
            </section>
            
            <!-- Jobb oldal: Felszerelés -->
            <section class="equipment-section dark-card">
                <h2><i class="fas fa-shield-alt"></i> Felszerelés</h2>
                <div class="inventory">
                    <div class="inventory-item dark-item"><i class="fas fa-sword"></i> Kard</div>
                    <div class="inventory-item dark-item"><i class="fas fa-shield"></i> Pajzs</div>
                    <div class="inventory-item dark-item"><i class="fas fa-vest"></i> Bőrvért</div>
                    <div class="inventory-item dark-item"><i class="fas fa-backpack"></i> Hátizsák</div>
                    <div class="inventory-item dark-item"><i class="fas fa-apple-alt"></i> Élelem (6)</div>
                    <div class="inventory-item dark-item"><i class="fas fa-coins"></i> Arany (20)</div>
                </div>
                
                <h3><i class="fas fa-flask"></i> Válassz egy varázsitalt:</h3>
                <div class="potion-buttons">
                    <button class="btn dark-btn potion-btn" onclick="selectPotion('agility')">
                        <i class="fas fa-bolt"></i> Ügyesség
                    </button>
                    <button class="btn dark-btn potion-btn" onclick="selectPotion('health')">
                        <i class="fas fa-heart"></i> Életerő
                    </button>
                    <button class="btn dark-btn potion-btn" onclick="selectPotion('luck')">
                        <i class="fas fa-clover"></i> Szerencse
                    </button>
                </div>
                <div id="potion-selection" class="selection-display"></div>
                
                <div class="centered-button-container">
                    <button class="btn primary-dark-btn start-adventure-btn" onclick="startAdventure()">
                        <i class="fas fa-play"></i> Kezdd a kalandot!
                    </button>
                </div>
            </section>
        </main>
        
        <div id="footer">
            <script>loadPage("/footer", "footer")</script>
        </div>
    </div>

    <script>
        let character = {
            agility: 0,
            health: 0,
            luck: 0,
            initialHealth: 0,
            potion: null
        };
        
        function rollStat(stat) {
            const diceElement = document.getElementById(`${stat}-value`);
            
            // Animáció indítása
            diceElement.style.animation = 'none';
            void diceElement.offsetWidth; // Trigger reflow
            diceElement.style.animation = 'diceRoll 0.8s ease-out';
            
            // Számítjuk ki az új értéket
            let finalValue = 0;
            
            if (stat === 'agility' || stat === 'luck') {
                const roll = Math.floor(Math.random() * 6) + 1;
                finalValue = roll + 6;
            } else if (stat === 'health') {
                const roll1 = Math.floor(Math.random() * 6) + 1;
                const roll2 = Math.floor(Math.random() * 6) + 1;
                finalValue = roll1 + roll2 + 12;
                character.initialHealth = finalValue;
                
                // Kezdeti életerő is animálása
                const initialHealthElement = document.getElementById('initial-health-value');
                initialHealthElement.style.animation = 'none';
                void initialHealthElement.offsetWidth;
                initialHealthElement.style.animation = 'diceRoll 0.8s ease-out';
                setTimeout(() => {
                    initialHealthElement.textContent = finalValue;
                }, 800);
            }
            
            // Karakter objektum frissítése
            character[stat] = finalValue;
            
            // Érték beállítása animáció után
            setTimeout(() => {
                diceElement.textContent = finalValue;
            }, 800);
        }
        
        function generateCharacter() {
            // Animate all stats sequentially
            const stats = ['agility', 'health', 'luck'];
            let index = 0;
            
            function rollNextStat() {
                if (index < stats.length) {
                    rollStat(stats[index]);
                    index++;
                    setTimeout(rollNextStat, 1000);
                } else {
                    // Értesítés
                    setTimeout(() => {
                        const notification = document.createElement('div');
                        notification.className = 'notification';
                        notification.innerHTML = `
                            <i class="fas fa-check-circle"></i>
                            <span>Karaktered elkészült!</span>
                            <br>
                            <small>Ügyesség: ${character.agility}, Életerő: ${character.health}, Szerencse: ${character.luck}</small>
                        `;
                        document.body.appendChild(notification);
                        
                        setTimeout(() => {
                            notification.remove();
                        }, 3000);
                    }, 1000);
                }
            }
            
            rollNextStat();
        }
        
        function resetCharacter() {
            // Karakter objektum visszaállítása
            character = {
                agility: 0,
                health: 0,
                luck: 0,
                initialHealth: 0,
                potion: null
            };
            
            // Összes érték visszaállítása
            const valueIds = ['agility-value', 'health-value', 'luck-value', 'initial-health-value'];
            
            valueIds.forEach(id => {
                const element = document.getElementById(id);
                element.style.animation = 'diceRollReverse 0.8s ease-out';
                setTimeout(() => {
                    element.textContent = '0';
                }, 800);
            });
            
            document.getElementById('potion-selection').textContent = '';
            
            // Varázsital gombok visszaállítása
            document.querySelectorAll('.potion-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
        }
        
        function selectPotion(type) {
            const potionNames = {
                agility: 'Ügyesség Itala',
                health: 'Életerő Itala',
                luck: 'Szerencse Itala'
            };
            
            character.potion = type;
            document.getElementById('potion-selection').textContent = `Kiválasztva: ${potionNames[type]}`;
            
            // Gombok kiemelése
            document.querySelectorAll('.potion-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }
        
        function startAdventure() {
            if (character.agility === 0 || character.health === 0 || character.luck === 0) {
                alert('Először generálj karaktert a kaland megkezdése előtt!');
                return;
            }
            
            if (!character.potion) {
                alert('Ne felejts el varázsitalt választani!');
                return;
            }
            
            // Animáció az induláshoz
            const button = event.target;
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-dice fa-spin"></i> Indítás...';
            button.disabled = true;
            
            // Animáció az induláshoz
            setTimeout(() => {
                button.innerHTML = originalText;
                button.disabled = false;
                
                // Átirányítás a játékhoz (ideiglenesen csak üzenet)
                const notification = document.createElement('div');
                notification.className = 'notification success';
                notification.innerHTML = `
                    <i class="fas fa-flag"></i>
                    <span>Sikeresen elindultál a kalandra!</span>
                    <br>
                    <small>Bátorságodat és eszedet fogja próbára tenni az Ítélet Labirintusa.</small>
                `;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                    window.location.href="/card/1"
                }, 4000);
            }, 1500);
        }
        
        // Alap karakter generálás oldal betöltésekor
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(generateCharacter, 1000);
        });
    </script>
</body>
</html>
</body>
</html>
